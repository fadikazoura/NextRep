spring:
  web:
    resources:
      cache:
        # The UI has no build step, so its files keep the same names after a deploy. "no-cache" makes the browser
        # ask "did this change?" every time; unchanged files get a tiny 304 (via Last-Modified), changed ones arrive
        # at once. No more stale screens after a release.
        cachecontrol:
          no-cache: true
          cache-private: true
  application:
    name: nextrep
  datasource:
    url: jdbc:postgresql://localhost:5432/nextrep
    username: nextrep
    password: nextrep
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

server:
  # gzip text responses (JS, CSS, JSON): the 3D library shrinks from ~530 KB to ~135 KB on the wire.
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is published over HTTP.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
nextrep:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    ttl: 1h
  ai:
    gemini:
      # Read from the environment; empty means "AI disabled, use the default generator".
      api-key: ${GEMINI_API_KEY:}
      # Lite model: fast and less overloaded; override with the NEXTREP_AI_GEMINI_MODEL env variable.
      model: gemini-3.1-flash-lite
      base-url: https://generativelanguage.googleapis.com
      timeout: 30s
  rate-limit:
    # Per-IP limits on login, sign-up, demo, password reset, contact and AI endpoints (see RateLimitFilter).
    enabled: ${NEXTREP_RATE_LIMIT_ENABLED:true}
    # Render sits behind Cloudflare, which puts the visitor's real IP in True-Client-IP (it can't be faked).
    client-ip-header: True-Client-IP
  mail:
    # Read from the environment; empty means "don't send, write emails to the log".
    brevo-api-key: ${BREVO_API_KEY:}
    base-url: https://api.brevo.com
    sender-email: nextrep.fitapp@gmail.com
    sender-name: NextRep
    # "Contact us" messages are forwarded here.
    support-inbox: nextrep.fitapp@gmail.com
    timeout: 10s
