services:
  postgres:
    image: postgres:17
    container_name: nextrep-db
    environment:
      POSTGRES_DB: nextrep
      POSTGRES_USER: nextrep
      POSTGRES_PASSWORD: nextrep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextrep -d nextrep"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole app in a container. Only starts with: docker compose --profile app up --build
  # (plain "docker compose up -d" still starts just the database for local development).
  app:
    profiles: ["app"]
    build: .
    container_name: nextrep-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nextrep
      SPRING_DATASOURCE_USERNAME: nextrep
      SPRING_DATASOURCE_PASSWORD: nextrep
      # Taken from your shell if set; never written into this file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-secret-change-me-0123456789}
    ports:
      - "8080:8080"

volumes:
  pgdata:
